services:
  - type: web
    name: hireken-contact
    runtime: node
    plan: free
    rootDir: contact-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://empoweringdavid.com,https://www.empoweringdavid.com,https://expandoutward.github.io
